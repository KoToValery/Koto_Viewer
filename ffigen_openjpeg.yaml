name: openjpeg_bridge
description: FFI bindings for openjpeg JPEG 2000 bridge

# Output file for the generated Dart bindings
output:
  bindings: lib/src/features/dicom_viewer/openjpeg_bridge_bindings.dart

# The C header to generate bindings from
headers:
  entry-points:
    - 'src/openjpeg_bridge/openjpeg_bridge.h'

# Only expose our two bridge functions (not openjpeg internals)
functions:
  include:
    - 'opj_decode_to_rgba'
    - 'opj_free_buffer'

# No structs, enums or typedefs needed (all primitives)
structs:
  exclude:
    - '.*'
enums:
  exclude:
    - '.*'
unnamed-enums:
  exclude:
    - '.*'

# Dart preamble for the generated file
preamble: |
  // AUTO-GENERATED by dart run ffigen. Do not modify by hand.
  // ignore_for_file: always_specify_types, camel_case_types
  // ignore_for_file: directives_ordering, non_constant_identifier_names

compiler-opts:
  - '-I${PWD}/src/openjpeg_bridge'
